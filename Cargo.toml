[package]
name = "hexbuffer-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
rig-core = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
tracing = "0.1"
reqwest = { version = "0.12", features = ["json"] }
keyring = "3"
